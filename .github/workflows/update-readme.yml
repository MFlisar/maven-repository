name: Update README

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [artifacts-published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Test README generator
        shell: pwsh
        run: .\.github\scripts\Test-UpdateReadme.ps1

      - name: Generate artifact table
        shell: pwsh
        run: .\.github\scripts\Update-Readme.ps1

      - name: Commit changed README
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update artifact overview" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
