name: Update README

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [artifacts-published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect deleted artifact files
        id: deletions
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            deleted="$(git diff --no-renames --diff-filter=D --name-only "$BEFORE" "$AFTER" -- artifacts/)"
            if [[ -n "$deleted" ]]; then
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
            else
              echo "rebuild=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-java@v6
        if: steps.deletions.outputs.rebuild == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Rebuild metadata after deletions
        if: steps.deletions.outputs.rebuild == 'true'
        shell: pwsh
        run: |
          $jar = & .\.github\scripts\Get-MavenArtifactJar.ps1
          $source = (Resolve-Path .\.github\scripts\RebuildMetadata.java).Path
          java --class-path "$jar" "$source" --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java --class-path "$jar" "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test README generator
        shell: pwsh
        run: .\.github\scripts\Test-UpdateReadme.ps1

      - name: Generate artifact table
        shell: pwsh
        run: .\.github\scripts\Update-Readme.ps1

      - name: Commit updated overview and metadata
        shell: bash
        run: |
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update artifact overview" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
