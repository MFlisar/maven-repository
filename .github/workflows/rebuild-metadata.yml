name: Rebuild Maven metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Maven version comparator
        shell: pwsh
        run: |
          $jar = Get-ChildItem /usr/share/maven/lib/maven-artifact-*.jar
          if (@($jar).Count -ne 1) { throw 'Expected one Maven artifact library on the runner.' }
          "MAVEN_ARTIFACT_JAR=$($jar.FullName)" >> $env:GITHUB_ENV

      - name: Test generators
        shell: pwsh
        run: |
          java --class-path "$env:MAVEN_ARTIFACT_JAR" .\.github\scripts\RebuildMetadata.java --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.github\scripts\Test-UpdateReadme.ps1

      - name: Rebuild metadata and README
        shell: pwsh
        run: |
          java --class-path "$env:MAVEN_ARTIFACT_JAR" .\.github\scripts\RebuildMetadata.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.github\scripts\Update-Readme.ps1

      - name: Commit rebuilt metadata and README
        shell: bash
        run: |
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: rebuild Maven metadata and artifact overview" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
